<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Tauri - Resumen Excel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="top-banner">
        <div class="banner-brand">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7h18M3 12h18M3 17h18"/>
            </svg>
            <span>Resumen Excel</span>
            <span class="banner-version">v0.1</span>
        </div>
        <nav class="banner-buttons" aria-label="Acciones globales">
            <button class="btn-nav" type="button" id="btnExportExcel" title="Exportar como Excel">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                <span class="btn-label">Excel</span>
            </button>
            <button class="btn-nav" type="button" id="btnExportPdf" title="Exportar como PDF">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 2v6h6"/></svg>
                <span class="btn-label">PDF</span>
            </button>
        </nav>
    </header>

    <div class="app-container">
        <aside class="sidebar-left">
            <details open>
                <summary class="files-summary">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
                    Archivos
                    <button class="btn-summary-action" type="button" id="btnLimpiarSeleccion" title="Limpiar la selección de archivos y hojas">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L21 10C21.5 10.5 21.5 11.5 21 12L11 22"/>
                            <path d="M16 15L8 7"/>
                        </svg>
                        Limpiar
                    </button>
                </summary>
                <ul class="file-list" id="fileList">
                    <!-- Los archivos se cargan dinámicamente desde main.js -->
                </ul>
            </details>
            <details>
                <summary>
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    Diccionario
                </summary>
                <div style="padding: 8px; display: flex; flex-direction: column; gap: 8px;">
                    <button class="btn-add-file" id="btnAddDiccionario" type="button">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                        Agregar Diccionario
                    </button>
                    <ul class="dictionary-list" id="dictionaryList" aria-live="polite"></ul>
                </div>
            </details>
            <div class="sidebar-actions">
                <button class="btn-secondary" type="button" id="btnProcesarSeleccionadas" title="Procesar hojas seleccionadas">
                    <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                    Procesar
                </button>
                <button class="btn-secondary" type="button" id="btnVincular" title="Vincular archivos">
                    <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    Vincular
                </button>
            </div>
            <button class="btn-add-file" id="btnAddExcel" type="button">
                <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Agregar Excel
            </button>
        </aside>

        <main class="main-center">
            <div class="table-container" style="margin-top: 16px;">
                <div class="table-header">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                    </svg>
                    <input type="text" id="tituloConsolidado" class="table-title-input" value="Consolidado de ingredientes" aria-label="Título de la tabla consolidada">
                    <button class="btn-toolbar" type="button" id="btnAutoColor" title="Asignar colores automáticamente">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.12a1.64 1.64 0 0 1 1.67-1.67h1.99c3.05 0 5.56-2.5 5.56-5.55C21.97 6.01 17.46 2 12 2z"/></svg>
                        <span>Auto-color</span>
                    </button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Ingrediente</th>
                            <th>Código</th>
                            <th>Unidad</th>
                            <th>Cantidad</th>
                            <th>Cantidad Total</th>
                            <th>Comentarios</th> <!-- Antes era Códigos -->
                        </tr>
                    </thead>
                    <tbody id="tablaConsolidadaBody">
                        <tr><td colspan="6" style="text-align:center; color:#888;">Haz clic en el nombre de una hoja para procesarla</td></tr>
                    </tbody>
                </table>
            </div>
        </main>

        <aside class="sidebar-right">
            <!-- Cuadro 1: Agrupación de secciones -->
            <div class="section-box">
                <div class="section-box-header" style="display: flex; gap: 8px; align-items: center;">
                    <input class="group-title-input" type="text" placeholder="Nombre de grupo" value="Nuevo Grupo" id="groupTitle">
                    <button class="btn-nav" id="btnNewGroup" title="Crear nuevo grupo" style="padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; color: var(--text-muted); font-size: 11px;">
                        + Nuevo
                    </button>
                </div>

                <div class="section-list-header">
                    <span class="col-name">Nombre sección</span>
                    <span class="col-alumnos">Alumnos</span>
                    <span class="col-proporcion">Proporción</span>
                    <span class="col-delete"></span>
                </div>

                <ul class="section-list" id="sectionList">
                    <!-- Secciones generadas dinámicamente -->
                </ul>

                <div class="section-box-footer">
                    <button class="btn-group-auto" type="button" id="btnAdjust" title="Calcular proporciones automáticamente">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        Auto
                    </button>
                    <button class="btn-group-save" type="button" id="btnSaveGroup">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
                        Guardar
                    </button>
                    <button class="btn-add-section" type="button" id="btnAddSection" title="Agregar sección">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                        Agregar
                    </button>
                </div>

                <button class="btn-calc-total" type="button" id="btnCalcularTotal" title="Calcular cantidad total por proporción">
                    <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></svg>
                    Calcular
                </button>
            </div>

            <!-- Cuadro 2: Secciones guardadas -->
            <div class="saved-sections-box">
                <div class="section-box-header">
                    <span>Secciones guardadas</span>
                </div>
                <ul class="saved-list" id="savedList">
                    <!-- Grupos guardados generados dinámicamente -->
                </ul>
            </div>
        </aside>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
