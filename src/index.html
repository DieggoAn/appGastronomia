<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Tauri - Resumen Excel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="top-banner ocultar-en-impresion">
        <div class="banner-brand">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7h18M3 12h18M3 17h18"/>
            </svg>
            <span>Resumen Excel</span>
            <span class="banner-version">v0.1</span>
        </div>
        <nav class="banner-buttons" aria-label="Acciones globales">
            <button class="btn-nav" type="button" id="btnAjustesProcesamiento" title="Ajustes generales y mapeo de insumos para leer Excel">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></svg>
                <span class="btn-label">Ajustes</span>
            </button>
            <button class="btn-nav" type="button" id="btnExportExcel" title="Exportar las filas visibles a Excel (.xlsx)">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                <span class="btn-label">Excel</span>
            </button>
            <button class="btn-nav" type="button" id="btnExportPdf" title="Exportar las filas visibles a PDF">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 2v6h6"/></svg>
                <span class="btn-label">PDF</span>
            </button>
        </nav>
    </header>

    <div class="app-container">
        <aside class="sidebar-left">
            <details open>
                <summary class="files-summary">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
                    Archivos
                    <span class="hojas-procesando ocultar-en-impresion" id="hojasProcesando" role="status" aria-live="polite" title="Hojas seleccionadas para procesar" hidden>
                        <span class="processing-spinner" id="hojasProcesandoSpinner" aria-hidden="true" hidden></span>
                        <span id="hojasProcesandoTexto">0 hojas</span>
                    </span>
                    <button class="btn-summary-action" type="button" id="btnLimpiarSeleccion" title="Limpiar la selección de archivos y hojas">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L21 10C21.5 10.5 21.5 11.5 21 12L11 22"/>
                            <path d="M16 15L8 7"/>
                        </svg>
                        Limpiar
                    </button>
                </summary>
                <ul class="file-list" id="fileList">
                    <!-- Los archivos se cargan dinámicamente desde main.js -->
                </ul>
            </details>
            <details>
                <summary>
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    Diccionario
                </summary>
                <div style="padding: 8px; display: flex; flex-direction: column; gap: 8px;">
                    <button class="btn-add-file" id="btnAddDiccionario" type="button">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                        Agregar Diccionario
                    </button>
                    <ul class="dictionary-list" id="dictionaryList" aria-live="polite"></ul>
                </div>
            </details>
            <div class="sidebar-actions">
                <div class="process-group" id="grupoProcesar">
                    <button class="btn-secondary" type="button" id="btnProcesarSeleccionadas" title="Auto-procesar activo: las hojas se procesan automáticamente" disabled>
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                        Procesar
                    </button>
                    <label class="auto-switch" title="Procesar automáticamente al cambiar de hoja o editar la tabla">
                        <input type="checkbox" id="chkAutoProcesar" checked>
                        <span class="auto-switch-track" aria-hidden="true">
                            <span class="auto-switch-thumb"></span>
                        </span>
                        <span class="auto-switch-text">Auto</span>
                    </label>
                </div>
                <button class="btn-secondary" type="button" id="btnVincular" title="Vincular hojas de Excel a grupos">
                    <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    Vincular
                </button>
            </div>
            <div class="sidebar-file-actions">
                <button class="btn-add-file" id="btnAddExcel" type="button">
                    <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    Agregar Excel
                </button>
                <button class="btn-delete-selected" id="btnEliminarSeleccionados" type="button" disabled title="Elimina de la lista los archivos con la casilla marcada">
                    <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 6h18"/>
                        <path d="M8 6V4h8v2"/>
                        <path d="M19 6l-1 14H6L5 6"/>
                        <path d="M10 11v6M14 11v6"/>
                    </svg>
                    Eliminar seleccionados
                </button>
            </div>
        </aside>

        <main class="main-center">
            <div class="table-container" style="margin-top: 16px;">
                <div class="table-header ocultar-en-impresion">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                    </svg>
                    <input type="text" id="tituloConsolidado" class="table-title-input" value="Consolidado de ingredientes" aria-label="Título de la tabla consolidada">
                    <span class="processing-indicator ocultar-en-impresion" id="estadoProcesamiento" role="status" aria-live="polite" hidden>
                        <span class="processing-spinner" aria-hidden="true"></span>
                        <span class="processing-text">Procesando…</span>
                    </span>
                    <span class="hojas-procesadas ocultar-en-impresion" id="hojasProcesadas" role="status" aria-live="polite">0 hojas procesadas</span>
                    <button class="btn-toolbar" type="button" id="btnFiltrarColor" title="Mostrar solo las filas de un color" aria-haspopup="menu" aria-expanded="false">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></svg>
                        <span id="filtrarColorLabel">Filtrar por color</span>
                        <span class="filter-color-badge" id="filtrarColorBadge" hidden></span>
                    </button>
                    <button class="btn-toolbar" type="button" id="btnResumenColores" title="Resumen de colores aplicados">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        <span>Colores</span>
                    </button>
                </div>

                <!-- Cabecera exclusiva de impresión: oculta en pantalla, se
                     rellena al pulsar "PDF" y se copia en la hoja de impresión. -->
                <div id="print-header" class="print-header ocultar-en-pantalla"></div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Ingrediente</th>
                            <th>Código</th>
                            <th>Unidad</th>
                            <th>Cantidad</th>
                            <th>Cantidad Total</th>
                            <th>Comentarios</th> <!-- Antes era Códigos -->
                        </tr>
                    </thead>
                    <tbody id="tablaConsolidadaBody">
                        <tr><td colspan="6" style="text-align:center; color: var(--text-muted);">Haz clic en el nombre de una hoja para procesarla</td></tr>
                    </tbody>
                </table>
            </div>
        </main>

        <aside class="sidebar-right">
            <!-- Cuadro 1: Agrupación de secciones -->
            <div class="section-box">
                <div class="section-box-header" style="display: flex; gap: 8px; align-items: center;">
                    <input class="group-title-input" type="text" placeholder="Nombre de grupo" value="Nuevo Grupo" id="groupTitle">
                    <button class="btn-nav" id="btnNewGroup" title="Crear nuevo grupo" style="padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; color: var(--text-muted); font-size: 11px;">
                        + Nuevo
                    </button>
                </div>

                <div class="section-list-header">
                    <span class="col-name">Nombre sección</span>
                    <span class="col-alumnos">Alumnos</span>
                    <span class="col-proporcion">Proporción</span>
                    <span class="col-delete"></span>
                </div>

                <ul class="section-list" id="sectionList">
                    <!-- Secciones generadas dinámicamente -->
                </ul>

                <div class="section-box-footer">
                    <button class="btn-group-auto" type="button" id="btnAdjust" title="Calcular proporciones automáticamente">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        Auto
                    </button>
                    <button class="btn-group-save" type="button" id="btnSaveGroup">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
                        Guardar
                    </button>
                    <button class="btn-add-section" type="button" id="btnAddSection" title="Agregar sección">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                        Agregar
                    </button>
                </div>

                <div class="calc-actions">
                    <button class="btn-calc-total" type="button" id="btnCalcularTotal" title="Calcular cantidad total por proporción">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></svg>
                        Calcular
                    </button>
                    <button class="btn-calc-total btn-calc-vinculados" type="button" id="btnCalcularVinculados" title="Calcular cada fila con el grupo vinculado a su hoja de origen">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></svg>
                        Calcular vinculados
                    </button>
                </div>
            </div>

            <!-- Cuadro 2: Secciones guardadas -->
            <div class="saved-sections-box">
                <div class="section-box-header">
                    <span>Secciones guardadas</span>
                    <button class="btn-import-groups" type="button" id="btnImportarGruposExcel" title="Crea grupos y secciones a partir de un archivo Excel">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <path d="M7 10l5 5 5-5"/>
                            <path d="M12 15V3"/>
                        </svg>
                        Importar Grupos
                    </button>
                    <button class="btn-delete-all-groups" type="button" id="btnEliminarTodosGrupos" title="Eliminar todos los grupos guardados" aria-label="Eliminar todos los grupos guardados">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 6h18"/>
                            <path d="M8 6V4h8v2"/>
                            <path d="M19 6l-1 14H6L5 6"/>
                            <path d="M10 11v6M14 11v6"/>
                        </svg>
                    </button>
                </div>
                <ul class="saved-list" id="savedList">
                    <!-- Grupos guardados generados dinámicamente -->
                </ul>
                <div class="saved-pagination" id="savedPagination" hidden>
                    <button class="btn-pagination" type="button" id="btnGruposAnterior">Anterior</button>
                    <span class="saved-pagination-info" id="savedPaginationInfo"></span>
                    <button class="btn-pagination" type="button" id="btnGruposSiguiente">Siguiente</button>
                </div>
            </div>
        </aside>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
