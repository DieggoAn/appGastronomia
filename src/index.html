<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Tauri - Resumen Excel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="top-banner">
        <div class="banner-brand">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7h18M3 12h18M3 17h18"/>
            </svg>
            <span>Resumen Excel</span>
            <span class="banner-version">v0.1</span>
        </div>
        <nav class="banner-buttons">
            <button class="btn-nav" type="button" data-action="estructura">Estructura</button>
            <button class="btn-nav" type="button" data-action="sql">SQL</button>
            <button class="btn-nav" type="button" data-action="buscar">Buscar</button>
            <button class="btn-nav" type="button" data-action="exportar">Exportar</button>
            <button class="btn-nav" type="button" data-action="importar">Importar</button>
            <button class="btn-nav" type="button" data-action="operaciones">Operaciones</button>
        </nav>
    </header>

    <div class="app-container">
        <aside class="sidebar-left">
            <details open>
                <summary>
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
                    Archivos
                </summary>
                <ul class="file-list" id="fileList">
                    <!-- Los archivos se cargan dinámicamente desde main.js -->
                </ul>
            </details>
            <button class="btn-add-file" type="button" id="btnAddFile">
                <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Agregar archivo
            </button>
            <div class="export-buttons">
                <button class="btn-export" type="button" id="btnExportExcel">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg> Exportar como Excel
                </button>
                <button class="btn-export" type="button" id="btnExportPdf">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 2v6h6"/></svg> Exportar como PDF
                </button>
            </div>
        </aside>

        <main class="main-center">
            <div class="table-container">
                <div class="table-header">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg> Resumen de datos — Archivos Excel seleccionados
                </div>
                <table class="data-table">
                    <thead>
                        <tr><th>Archivo</th><th>Hoja</th><th>Filas</th><th>Columnas</th><th>Última modificación</th></tr>
                    </thead>
                    <tbody id="summaryTableBody">
                        <!-- Filas generadas dinámicamente -->
                    </tbody>
                </table>
            </div>
        </main>

        <aside class="sidebar-right">
            <!-- Cuadro 1: Agrupación de secciones -->
            <div class="section-box">
                <div class="section-box-header" style="display: flex; gap: 8px; align-items: center;">
                    <input class="group-title-input" type="text" placeholder="Nombre de grupo" value="Nuevo Grupo" id="groupTitle">
                    <button class="btn-nav" id="btnNewGroup" title="Crear nuevo grupo" style="padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; color: var(--text-muted); font-size: 11px;">
                        + Nuevo
                    </button>
                </div>

                <div class="section-list-header">
                    <span class="col-name">Nombre sección</span>
                    <span class="col-alumnos">Alumnos</span>
                    <span class="col-proporcion">Proporción</span>
                    <span class="col-delete"></span>
                </div>

                <ul class="section-list" id="sectionList">
                    <!-- Secciones generadas dinámicamente -->
                </ul>

                <div class="section-box-footer">
                    <button class="btn-group-auto" type="button" id="btnAdjust" title="Calcular proporciones automáticamente">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        Auto
                    </button>
                    <button class="btn-group-save" type="button" id="btnSaveGroup">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
                        Guardar
                    </button>
                    <button class="btn-add-section" type="button" id="btnAddSection" title="Agregar sección">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                        Agregar
                    </button>
                </div>
            </div>

            <!-- Cuadro 2: Secciones guardadas -->
            <div class="saved-sections-box">
                <div class="section-box-header">
                    <span>Secciones guardadas</span>
                </div>
                <ul class="saved-list" id="savedList">
                    <!-- Grupos guardados generados dinámicamente -->
                </ul>
            </div>
        </aside>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
